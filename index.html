  <script>
    // Tab switching
    function switchTab(tab) {
        const swPanel = document.getElementById('stopwatch-panel');
        const tmPanel = document.getElementById('timer-panel');
        const tabSw = document.getElementById('tab-stopwatch');
        const tabTm = document.getElementById('tab-timer');
        if (tab === 'stopwatch') {
            swPanel.classList.remove('hidden'); tmPanel.classList.add('hidden');
            tabSw.className = tabSw.className.replace('tab-inactive','tab-active');
            tabTm.className = tabTm.className.replace('tab-active','tab-inactive');
        } else {
            tmPanel.classList.remove('hidden'); swPanel.classList.add('hidden');
            tabTm.className = tabTm.className.replace('tab-inactive','tab-active');
            tabSw.className = tabSw.className.replace('tab-active','tab-inactive');
        }
    }

    // Stopwatch
    let swInterval = null, swMs = 0, swRunning = false;
    function swToggle() {
        if (swRunning) { clearInterval(swInterval); swRunning = false; }
        else { swInterval = setInterval(() => { swMs += 100; swRender(); }, 100); swRunning = true; }
    }
    function swReset() { clearInterval(swInterval); swRunning = false; swMs = 0; swRender(); }
    function swRender() {
        const t = Math.floor(swMs / 1000);
        const h = String(Math.floor(t/3600)).padStart(2,'0');
        const m = String(Math.floor((t%3600)/60)).padStart(2,'0');
        const s = String(t%60).padStart(2,'0');
        document.getElementById('sw-display').textContent = `${h}:${m}:${s}`;
    }

    // Timer
    let tmInterval = null, tmSeconds = 0, tmRunning = false;
    function tmToggle() {
        if (tmRunning) { clearInterval(tmInterval); tmRunning = false; return; }
        if (tmSeconds <= 0) {
            const h = parseInt(document.getElementById('t-h').value)||0;
            const m = parseInt(document.getElementById('t-m').value)||0;
            const s = parseInt(document.getElementById('t-s').value)||0;
            tmSeconds = h*3600 + m*60 + s;
            if (tmSeconds <= 0) return;
            document.getElementById('timer-setup').classList.add('hidden');
            document.getElementById('timer-display').classList.remove('hidden');
        }
        document.getElementById('timer-done-msg').classList.add('hidden');
        tmRunning = true;
        tmRender();
        tmInterval = setInterval(() => {
            tmSeconds--;
            tmRender();
            if (tmSeconds <= 0) { clearInterval(tmInterval); tmRunning = false; playAlarm(); document.getElementById('timer-done-msg').classList.remove('hidden'); }
        }, 1000);
    }
    function tmReset() {
        clearInterval(tmInterval); tmRunning = false; tmSeconds = 0;
        document.getElementById('timer-setup').classList.remove('hidden');
        document.getElementById('timer-display').classList.add('hidden');
        document.getElementById('timer-done-msg').classList.add('hidden');
    }
    function tmRender() {
        const h = String(Math.floor(tmSeconds/3600)).padStart(2,'0');
        const m = String(Math.floor((tmSeconds%3600)/60)).padStart(2,'0');
        const s = String(tmSeconds%60).padStart(2,'0');
        document.getElementById('timer-display').textContent = `${h}:${m}:${s}`;
    }

    // Audio alarm
    function playAlarm() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const beep = (freq, start, dur) => {
            const o = ctx.createOscillator(); const g = ctx.createGain();
            o.connect(g); g.connect(ctx.destination);
            o.frequency.value = freq; o.type = 'sine';
            g.gain.setValueAtTime(0.3, ctx.currentTime + start);
            g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + dur);
            o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur);
        };
        for (let i = 0; i < 4; i++) { beep(880, i*0.3, 0.2); }
    }
